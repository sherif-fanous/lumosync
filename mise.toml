[settings.npm]
package_manager = "npm"

[env]
_.file = ".env"

[tools]
node = "24.21.0"
"npm:pnpm" = { version = "12.3.4", allow_builds = ["pnpm"] }

[tasks.check]
depends = ["format-check", "type-check", "lint", "test"]

[tasks.compile]
run = "pnpm run compile"

[tasks.format]
run = "pnpm run format"

[tasks.format-check]
run = "pnpm run format-check"

[tasks.lint]
run = "pnpm run lint"

[tasks.lint-fix]
run = "pnpm run lint-fix"

[tasks.pack-check]
run = "pnpm run pack-check"

[tasks.package]
run = "pnpm run package"

[tasks.publish]
description = "Publish the current version to Visual Studio Marketplace"
depends = ["check"]
run = """
: "${VSCE_PAT:?Set VSCE_PAT in .env before publishing}"
pnpm exec vsce publish --no-dependencies
"""

[tasks.sort-package-json]
run = "pnpm run sort-package-json"

[tasks.test]
run = "pnpm test"

[tasks.test-vscode]
run = "pnpm run test-vscode"

[tasks.test-watch]
run = "pnpm run test-watch"

[tasks.type-check]
run = "pnpm run type-check"

[tasks.update-deps]
run = "pnpm run update-deps"

[tasks.watch]
run = "pnpm run watch"
